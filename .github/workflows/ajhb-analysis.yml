name: AJHB analysis and outputs

# Triggered after AJHB analysis code/data changes.

on:
  push:
    branches: [main]
    paths:
      - "production/ajhb_nwl/R/**"
      - "production/ajhb_nwl/00_master_run_all.R"
      - "production/ajhb_nwl/data_raw/**"
      - ".github/workflows/ajhb-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajhb-analysis-main
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::ggplot2
            any::janitor
            any::broom
            any::forcats
            any::stringr
            any::writexl
            any::gt
            any::webshot2
            any::lubridate
            any::patchwork

      - name: Show browser availability
        shell: bash
        run: |
          which google-chrome || true
          which chromium || true
          google-chrome --version || true
          chromium --version || true

      - name: Run complete AJHB analysis
        working-directory: production/ajhb_nwl
        run: Rscript 00_master_run_all.R

      - name: Validate reviewer outputs
        working-directory: production/ajhb_nwl
        shell: Rscript {0}
        run: |
          d <- readRDS("data_processed/df_analysis_clean.rds")
          stopifnot(nrow(d) > 0)
          stopifnot("neonatal_death_28" %in% names(d))

          n_total <- nrow(d)
          n_death <- sum(d$neonatal_death_28 == 1, na.rm = TRUE)
          n_one <- sum((!is.na(d$weight_a)) + (!is.na(d$weight_b)) == 1)
          n_two <- sum((!is.na(d$weight_a)) + (!is.na(d$weight_b)) == 2)
          n_exact <- sum(
            !is.na(d$weight_a) & !is.na(d$weight_b) &
            !is.na(d$day_a) & !is.na(d$day_b) &
            d$day_a == 5 & d$day_b == 10
          )

          stopifnot(n_one + n_two == n_total)
          stopifnot(n_exact <= n_two)

          expected <- c(
            "outputs/tables_png/Table_1_Cohort_Characteristics.png",
            "outputs/appendix_tables/Supplementary_Table_S8_One_vs_Two_Weight_Measurements.png",
            "outputs/appendix_tables/Supplementary_Table_S9_Exact_Day5_Day10_vs_Other_Patterns.png",
            "outputs/appendix_tables/Supplementary_Table_S10_Exact_Day5_Day10_Sensitivity.png",
            "outputs/reviewer_revision/AJHB_reviewer_revision_analyses.xlsx",
            "outputs/reviewer_revision/AJHB_reviewer_supplement_ready.xlsx"
          )
          stopifnot(all(file.exists(expected)))

          cat(
            sprintf(
              "QA OK: N=%d; neonatal deaths <=28d=%d; one measurement=%d; two measurements=%d; exact day5/day10=%d\n",
              n_total, n_death, n_one, n_two, n_exact
            )
          )

      - name: Commit regenerated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/ajhb_nwl/outputs
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Regenerate AJHB analysis outputs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
